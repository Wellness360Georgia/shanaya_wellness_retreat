<style>
:root{
  --ink:#22302C;
  --paper:#F1F3EF;
  --stone:#75817C;
  --wood:#A97B48;
  --glacier:#4C8378;
  --line:#D9DED9;
  --display:"Cormorant Garamond","Noto Serif Georgian",serif;
  --body:"Manrope","Noto Sans Georgian",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.6;font-size:16px}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}

/* ---------- header ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:50;background:rgba(241,243,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.wordmark{font-family:var(--display);font-weight:600;font-size:1.3rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.wordmark small{font-family:var(--body);font-size:.62rem;font-weight:700;letter-spacing:.18em;color:var(--stone);margin-left:10px}
nav.main{display:flex;gap:20px}
nav.main a{text-decoration:none;font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--stone)}
nav.main a:hover,nav.main a:focus-visible{color:var(--ink)}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px}
.langs button{border:0;background:transparent;font-family:var(--body);font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:16px;cursor:pointer;color:var(--stone)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}
@media(max-width:960px){nav.main{display:none}.wordmark small{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:92vh;display:flex;align-items:flex-end;color:#fff;
  background:linear-gradient(160deg,#3c4f49 0%,#5c6f66 45%,#8d9a90 100%);}
.hero .photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s}
.hero .photo.on{opacity:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,28,25,.74) 0%,rgba(20,28,25,.15) 55%,rgba(20,28,25,.25) 100%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:110px;padding-top:140px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#cfd9d2;margin-bottom:14px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(3.4rem,9vw,6.4rem);line-height:1;letter-spacing:.03em}
.descriptor{font-size:.95rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#d8c5ab;margin-top:10px}
.hero p.sub{max-width:38em;margin-top:22px;font-size:1.05rem;color:#e4e9e4}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:.9rem;letter-spacing:.04em;padding:14px 26px;border-radius:3px;transition:transform .15s,background .15s;border:0;cursor:pointer;font-family:var(--body)}
.btn:hover{transform:translateY(-2px)}
.btn.solid{background:var(--wood);color:#fff}
.btn.ghost{border:1px solid rgba(255,255,255,.75);color:#fff;background:transparent}

/* ridgeline signature */
.ridge{display:block;width:100%;height:70px;margin-top:-1px;background:transparent}
.ridge path{fill:var(--paper)}
.hero .ridge{position:absolute;bottom:-1px;left:0;z-index:3}

/* ---------- sections ---------- */
section{padding:80px 0}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--glacier);margin-bottom:12px}
h2{font-family:var(--display);font-weight:500;font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.15;margin-bottom:18px}
.lead{max-width:46em;color:#3d4b46}

/* facts strip */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:44px}
.fact{background:var(--paper);padding:26px 22px}
.fact b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1.1;margin-bottom:6px}
.fact small{font-size:.85rem;color:var(--stone);font-weight:600;letter-spacing:.03em}

/* amenities */
.amen{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:44px}
.amen .card{border:1px solid var(--line);border-left:3px solid var(--glacier);background:#fff;padding:26px 24px;border-radius:3px}
.amen .card:last-child{grid-column:1/-1}
.card h3{font-family:var(--display);font-size:1.4rem;font-weight:600;margin-bottom:8px}
.card p{color:#3d4b46;font-size:.95rem}
@media(max-width:700px){.amen{grid-template-columns:1fr}.amen .card:last-child{grid-column:auto}}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:44px}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:3px;background:linear-gradient(150deg,#dfe4de,#c6cfc7)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cap{position:absolute;left:0;bottom:0;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5e6a64;padding:8px 10px}
.ph.big{grid-column:span 2}
@media(max-width:700px){.gallery{grid-template-columns:1fr 1fr}.ph.big{grid-column:span 2}}

/* terms (dark) */
.terms{background:var(--ink);color:var(--paper)}
.terms h2{color:#fff}
.terms .lead{color:#c7d2cb}
.terms ul{list-style:none;margin:26px 0 34px;max-width:46em}
.terms li{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14);display:flex;gap:12px;align-items:baseline}
.terms li::before{content:"—";color:var(--wood);font-weight:700}
.terms .cta-row{margin-top:0}
.terms .btn.ghost{border-color:rgba(255,255,255,.6)}

/* availability */
.calbox{margin-top:36px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.calbox iframe{display:block;width:100%;height:560px;border:0}
.calnote{padding:40px 26px;text-align:center;color:var(--stone);font-size:.95rem}
.hint{margin-top:14px;font-size:.85rem;color:var(--stone)}

/* location */
.loc{display:grid;grid-template-columns:1fr 1.2fr;gap:44px;align-items:start}
.loc iframe{width:100%;height:420px;border:0;border-radius:4px;filter:grayscale(15%)}
.loc address{font-style:normal;margin-top:18px;color:#3d4b46}
.loc a.map{display:inline-block;margin-top:14px;font-weight:700;font-size:.9rem;color:var(--glacier)}
@media(max-width:820px){.loc{grid-template-columns:1fr}}

/* booking */
.book{background:#e7ebe6}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:36px;max-width:760px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#4b5a54}
input,textarea{font-family:var(--body);font-size:1rem;padding:12px 14px;border:1px solid #c3ccc4;border-radius:3px;background:#fff;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--glacier);outline-offset:0;border-color:var(--glacier)}
.sendrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.wa{background:#1f7a5a;color:#fff}
.tg{background:#2a7ea8;color:#fff}
.tg-only{display:none}
body.has-tg .tg-only{display:inline-block}
@media(max-width:640px){form{grid-template-columns:1fr}}

/* footer */
footer{padding:44px 0 60px;border-top:1px solid var(--line);color:var(--stone);font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:baseline}
</style>
</head>

let lang = "en";
const nav = (navigator.language||"en").slice(0,2);
if(nav==="ru") lang="ru"; else if(nav==="ka") lang="ka";

function apply(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = T[lang][el.dataset.i18n];
    if(typeof v==="string") el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;apply();}));
apply();

if(TELEGRAM) document.body.classList.add("has-tg");

/* hero photo: appears only if assets/hero.jpg exists */
(function(){
  const img = new Image();
  img.onload = ()=>{const p=document.getElementById("heroPhoto");p.style.backgroundImage="url(assets/hero.jpg)";p.classList.add("on");};
  img.src = "assets/hero.jpg";
})();

/* Google Calendar embed */
if(CALENDAR_ID){
  const box = document.getElementById("calbox");
  box.innerHTML = "";
  const f = document.createElement("iframe");
  f.title = "Availability";
  f.loading = "lazy";
  f.src = "https://calendar.google.com/calendar/embed?src="+encodeURIComponent(CALENDAR_ID)
        + "&ctz=Asia%2FTbilisi&mode=MONTH&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0";
  box.appendChild(f);
}

/* messaging */
function openWA(msg){window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg),"_blank");}
function openTG(msg){window.open("https://t.me/"+TELEGRAM+"?text="+encodeURIComponent(msg),"_blank");}
function formMsg(){
  const g = id=>document.getElementById(id).value.trim();
  return T[lang].wa_msg(g("fname")||"—", g("fformat")||"—", g("fguests")||"10", g("fin")||"—", g("fout")||"—", g("fmsg"));
}
document.getElementById("heroWa").addEventListener("click",()=>openWA(formMsg()));
document.getElementById("heroDeck").addEventListener("click",()=>openWA(T[lang].deck_msg));
document.getElementById("deckWa").addEventListener("click",()=>openWA(T[lang].deck_msg));
document.getElementById("deckTg").addEventListener("click",()=>openTG(T[lang].deck_msg));
document.getElementById("sendWa").addEventListener("click",()=>openWA(formMsg()));
document.getElementById("sendTg").addEventListener("click",()=>openTG(formMsg()));

document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
